[project]
name = "zhs-exam-mcp"
version = "0.1.0"
description = "智慧树章节测试：读题与作答辅助 MCP（stdio）"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "playwright>=1.45",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
zhs-exam-mcp = "zhs_exam_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhs_exam_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
